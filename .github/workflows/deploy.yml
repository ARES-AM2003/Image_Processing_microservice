name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: blueneontech/imageprocessor:v1
          cache-from: type=registry,ref=blueneontech/imageprocessor:buildcache
          cache-to: type=registry,ref=blueneontech/imageprocessor:buildcache,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "🔐 Logging in to Docker Hub..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "⬇️  Pulling latest image..."
            docker pull blueneontech/imageprocessor:v1

            echo "🛑 Stopping existing container..."
            docker stop image-processor || true
            docker rm image-processor || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name image-processor \
              --network fotosfolio_network \
              --env-file /opt/image-processor/.env \
              -p 3001 \
              --restart unless-stopped \
              --health-cmd='wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1' \
              --health-interval=30s \
              --health-retries=3 \
              --health-timeout=10s \
              --health-start-period=40s \
              blueneontech/imageprocessor:v1

            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"

            echo "📊 Container status:"
            docker ps -f name=image-processor

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo "⏳ Waiting for container to be healthy..."
            sleep 10

            CONTAINER_STATUS=$(docker inspect --format='{{.State.Health.Status}}' image-processor 2>/dev/null || echo "unknown")

            if [ "$CONTAINER_STATUS" = "healthy" ] || [ "$CONTAINER_STATUS" = "starting" ]; then
              echo "✅ Container is $CONTAINER_STATUS"
              exit 0
            else
              echo "❌ Container health check failed: $CONTAINER_STATUS"
              echo "📋 Container logs:"
              docker logs --tail 50 image-processor
              exit 1
            fi
